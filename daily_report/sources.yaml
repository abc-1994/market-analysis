# Locked source list for the daily market report.
# Do not improvise sources at research time — only query domains listed here.
# To add/remove a source, edit this file (and note the change in git history);
# the build script cross-checks every cited source's domain against this list.

categories:
  macro_rates:
    label: "Rates & Macro"
    sources:
      - name: "Federal Reserve"
        domain: "federalreserve.gov"
      - name: "U.S. Treasury"
        domain: "home.treasury.gov"
      - name: "FRED"
        domain: "fred.stlouisfed.org"
      - name: "ECB"
        domain: "ecb.europa.eu"
      - name: "Bank of England"
        domain: "bankofengland.co.uk"
      - name: "Bank of Japan"
        domain: "boj.or.jp"
      - name: "People's Bank of China"
        domain: "pbc.gov.cn"
      - name: "Reuters"
        domain: "reuters.com"
      - name: "Financial Times"
        domain: "ft.com"
    # Sovereign curve points to report a level for every day, regardless of
    # which curve is driving the day's theme. Best-effort — see
    # checks.min_watchlist_coverage_pct.
    watchlist:
      - "US 2Y Treasury"
      - "US 10Y Treasury"
      - "US 30Y Treasury"
      - "Germany 10Y Bund"
      - "UK 10Y Gilt"
      - "Japan 10Y JGB"
      - "China 10Y CGB"

  equities:
    label: "Equities"
    sources:
      - name: "Reuters"
        domain: "reuters.com"
      - name: "Financial Times"
        domain: "ft.com"
      - name: "Bloomberg"
        domain: "bloomberg.com"
      - name: "WSJ"
        domain: "wsj.com"
      - name: "MarketWatch"
        domain: "marketwatch.com"
      - name: "CNBC"
        domain: "cnbc.com"
      - name: "MSCI"
        domain: "msci.com"
      - name: "FTSE Russell"
        domain: "lseg.com"
    # Broad, market-cap-weighted global/regional benchmarks reported daily,
    # not just whichever index is in the day's headline.
    #
    # currency: the base currency the level/return is quoted in. MSCI's
    #   global/regional aggregate series (ACWI IMI, World, EM) are
    #   canonically published in USD; single-market indices (STOXX 600,
    #   FTSE 100, Nikkei 225, Hang Seng, CSI 300) are reported in their home
    #   currency per standard market/press convention, not USD-converted.
    #   Mixing these on one board without labeling currency is misleading —
    #   don't compare a USD figure to a local-currency figure at face value.
    # hedged: true/false only applies to the USD-denominated MSCI aggregate
    #   series (report the standard unhedged/net series unless a hedged
    #   series is specifically the point). null = not applicable (US
    #   domestic indices and single-market local-currency indices have no
    #   hedging concept — there's no cross-currency translation to hedge).
    watchlist:
      - metric: "MSCI ACWI IMI"
        currency: "USD"
        hedged: false
      - metric: "MSCI World"
        currency: "USD"
        hedged: false
      - metric: "MSCI Emerging Markets"
        currency: "USD"
        hedged: false
      - metric: "S&P 500"
        currency: "USD"
        hedged: null
      - metric: "Nasdaq 100"
        currency: "USD"
        hedged: null
      - metric: "STOXX Europe 600"
        currency: "EUR"
        hedged: null
      - metric: "FTSE 100"
        currency: "GBP"
        hedged: null
      - metric: "Nikkei 225"
        currency: "JPY"
        hedged: null
      - metric: "Hang Seng"
        currency: "HKD"
        hedged: null
      - metric: "CSI 300"
        currency: "CNY"
        hedged: null

  credit:
    label: "Credit"
    sources:
      - name: "Reuters"
        domain: "reuters.com"
      - name: "Financial Times"
        domain: "ft.com"
      - name: "WSJ"
        domain: "wsj.com"

  private_markets:
    label: "Private Equity & Private Credit"
    sources:
      - name: "PitchBook News"
        domain: "pitchbook.com"
      - name: "Private Equity International"
        domain: "privateequityinternational.com"
      - name: "Axios Pro Rata"
        domain: "axios.com"
      - name: "Reuters"
        domain: "reuters.com"
      - name: "Financial Times"
        domain: "ft.com"

  fx_commodities:
    label: "FX & Commodities"
    sources:
      - name: "Reuters"
        domain: "reuters.com"
      - name: "Financial Times"
        domain: "ft.com"
      - name: "EIA"
        domain: "eia.gov"
    watchlist:
      - "DXY (Dollar Index)"
      - "EUR/USD"
      - "USD/JPY"
      - "GBP/USD"
      - "USD/CNY"
      - "USD/CHF"
      - "AUD/USD"
      - "Gold"
      - "WTI Crude"
      - "Brent Crude"

# Order the report sections render in. Must match category keys above.
section_order:
  - macro_rates
  - equities
  - credit
  - private_markets
  - fx_commodities

# Quality gates applied by build_report.py
checks:
  min_themes_per_category: 1
  min_sources_per_theme: 1
  max_source_age_hours: 36
  # Fraction of a category's watchlist that must have a reported level
  # before that category is flagged degraded for thin levels coverage.
  # (credit/private_markets have no watchlist, so this only applies where
  # sources.yaml defines one.)
  min_watchlist_coverage_pct: 50
  # Every key_levels entry must carry an "as_of" date (the date the level
  # itself reflects, not when an article about it was published). Flagged
  # stale if more than this many days before the report's date — kept
  # generous (not 1) to tolerate weekends/holidays across different
  # exchanges without false-flagging every Monday report.
  max_as_of_age_days: 4
  # Every key_levels entry must carry a "cross_check": a second value for
  # the same metric from a different whitelisted domain than the primary
  # source. The two are compared numerically and flagged if they disagree
  # by more than this tolerance — catches a wrong/stale/mis-scraped figure
  # instead of trusting a single source blindly.
  #   cross_check_tolerance_pct: relative tolerance for price-like values
  #     (index levels, FX rates, commodity prices), e.g. 0.5 = 0.5%.
  #   cross_check_tolerance_pp: absolute tolerance in percentage points for
  #     values quoted as a percentage (yields), e.g. 0.05 = 5bp.
  cross_check_tolerance_pct: 0.5
  cross_check_tolerance_pp: 0.05
